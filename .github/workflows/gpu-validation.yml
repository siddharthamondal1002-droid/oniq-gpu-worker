# GPU validation — the ONLY workflow that can hold the RunPod credential,
# and therefore the one whose shape is load-bearing. The gates, in order
# of how much they matter (worker-ci's harness tests verify them by
# parsing this file, not by reading it):
#
# 1. workflow_dispatch ONLY. No push, no schedule, no pull_request:
#    a merge must never be able to rent a GPU.
# 2. Default mode is read-only discovery and costs $0.00. Spending
#    additionally requires typing SPEND into an input.
# 3. cancel-in-progress: false — cancelling a run that holds a worker is
#    precisely how an orphan is created; the cleanup step never runs.
# 4. The orphan sweep runs if: always() and FAILS the run when it cannot
#    confirm zero: a sweep that cannot reach the API reports None, never
#    0 — "cannot confirm terminated" and "confirmed terminated" are
#    never the same value.
# 5. CI cannot create an endpoint, only verify one: min_workers=0 /
#    max_workers=1 is checked against the live endpoint before any job is
#    sent, and refused otherwise.
# 6. R2 credentials are NOT GitHub secrets. They live in the RunPod
#    endpoint's environment; CI submits jobs and never touches the bucket.
#
# The spend job requires the gpu-spend environment (owner-configured
# required reviewers — that click is the "gpu-spend approval"). Owner
# directive 2026-08-25: no separate preflight job gates the spend path —
# every check runs INSIDE the spend job, immediately before
# provisioning, behind the environment pause. Because GitHub waves a job
# straight through an unprotected environment, the run path verifies
# EVIDENCE of the pause (this run's recorded approval via the API) and
# refuses to provision without it. All spend-path decisions live in
# validation/spend_run.py, which is tested offline — not in YAML.

name: gpu-validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = read-only, $0. spend = the gated live path. standby-zero = patch workersStandby to 0 (spend reduction, $0). standby-probe = READ the standby facts and the API schema without attempting any write, $0 — use this once the patch is known to be refused. queue-probe = READ queue counts and one job's status across every endpoint, $0. stale-cancel = cancel ONE named run on ONE named endpoint, $0 (literal token required) - never a queue purge. image-size = build the base stage, measure it, and survey what the media bake would download, $0 - answers whether a hosted runner can build the media image at all. model-bench = measure every candidate in the owner's expanded benchmark against the HuggingFace registry and project its VRAM, $0 and no GPU - weights are measured, working sets are projected, runtime/cost/quality stay PENDING-PROBE. advisory = the standalone free preflight, $0 — reads the LIVE endpoint config; expected to end environment-unprotected on this plan (no required reviewers), with the endpoint facts printed before the stop."
        type: choice
        options: [discover, spend, standby-zero, standby-probe, advisory, queue-probe, stale-cancel, template-probe, image-size, template-attach, template-env, ltx-discover, frames-pull, model-bench]
        default: discover
      public_base:
        description: "R2 public READ base, e.g. https://pub-<id>.r2.dev. PUBLIC configuration, never a secret and never a presigned URL (one with a query string is refused). Overrides the R2_PUBLIC_BASE_URL repository variable for this run."
        type: string
        default: ""
      frame_keys:
        description: "frames-pull: comma-separated R2 object keys to fetch frames from, e.g. validation/out/ltx-001.mp4. Read-only, $0 — these are objects that ALREADY exist; no job is submitted."
        type: string
        default: ""
      signed_urls:
        description: "frames-pull, PRIVATE BUCKET path: presigned read-only GET URLs, one per clip, comma or newline separated. Use this instead of frame_keys when the bucket is private (owner directive 2026-08-29 — production R2 stays private). EACH URL IS A CREDENTIAL: use the SHORTEST workable expiry, because GitHub records dispatch inputs on the run. They are ::add-mask::ed before anything can print one, and never reach a log, report or artifact."
        type: string
        default: ""
      stale_job_id:
        description: "RunPod run id for queue-probe / stale-cancel."
        type: string
        default: ""
      cancel_token:
        description: "Type CANCEL-STALE-RUN (exactly) to allow stale-cancel. Cancels ONE named run - never a queue purge."
        type: string
        default: ""
      spend:
        description: "Type SPEND (exactly) to allow the spend job."
        type: string
        default: ""
      through_phase:
        description: "Last phase when spending. Image: 16 = one job, 17 = +failure battery, 18 = +5-job, 19 = +20-job. Video: 16 = one job, 18 = the five-scene battery (exactly five)."
        type: choice
        options: ["16", "17", "18", "19"]
        default: "16"
      op:
        description: "Workload for the spend job. video_generate = one LTX image-to-video. image_generate = ONE still from ONIQ's own image engine (text-only, no input_key). audio_mux = narration onto the EXISTING video named by test_input_key (one canary, phase 16 only)."
        type: choice
        options: [image_preprocess, image_generate, video_generate, audio_mux]
        default: image_preprocess
      endpoint_id:
        description: "Endpoint id (optional; must match the single live endpoint)."
        type: string
        default: ""
      template_id:
        description: "Template id to look for in template-probe. Defaults to the id the endpoint references."
        type: string
        default: "hhhdwtjw0y"
      image_ref:
        description: "Digest-pinned image for template-attach, e.g. ghcr.io/owner/repo@sha256:... A tag is refused."
        type: string
        default: ""
      attach_token:
        description: "Type ATTACH-TEMPLATE (exactly) to allow template-attach. Creates ONE template and repoints ONE endpoint."
        type: string
        default: ""
      secret_names:
        description: "template-env: the RunPod SECRET NAMES backing the three storage variables, comma-separated, in storage.REQUIRED_VARS order (endpoint, access key id, secret access key). Names only - never a value. Blank refuses, because a guessed name expands to nothing and looks like success. The variable names themselves are deliberately not spelled in this file: gate 6 forbids them here so they can never be wired to a GitHub secret."
        type: string
        default: ""
      env_token:
        description: "Type SET-TEMPLATE-ENV (exactly) to allow template-env. Writes the env field of ONE template, by reference."
        type: string
        default: ""
      plate:
        description: "image_generate only: WHICH conditioning plate to draw — a = Maya + girl + red balloon on the platform, b = black train at the platform (owner directive 2026-08-29, multi-reference conditioning; one dispatch draws one plate)."
        type: choice
        options: [a, b]
        default: a
      test_input_key:
        description: "R2 key of the test input image in the oniq-gpu bucket."
        type: string
        default: "validation/input.jpg"
      test_output_prefix:
        description: "R2 key prefix for test outputs."
        type: string
        default: "validation/out"

permissions:
  contents: read

concurrency:
  group: gpu-validation
  cancel-in-progress: false

jobs:
  discover:
    name: "Phase 4-7: read-only discovery, $0"
    runs-on: ubuntu-latest
    # The key lives as a gpu-spend ENVIRONMENT secret (2026-08-25 era);
    # a job without the environment reads an empty string — measured on
    # run #7, 2026-08-26. The environment has no required reviewers on
    # this plan (see APPROVAL_MODE below), so attaching it here gates
    # nothing and restores this $0 job's designed read access.
    environment: gpu-spend
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Credential present (owner action if not)
        run: |
          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "::error::RUNPOD_API_KEY secret is not configured on this repository. Adding it is an owner action (repo Settings -> Secrets and variables -> Actions). Discovery cannot run without it; nothing was spent."
            exit 1
          fi
          echo "credential present"

      - name: Discover — RAW first, parsed second
        run: python runpod_client.py discover --json discovery.json

      - name: "Phase 6-7: live target-GPU figures and the financial gate"
        run: |
          python - <<'EOF'
          import json
          from validation import admission

          report = json.load(open("discovery.json"))
          catalogue = report["gpu_catalogue_parsed"]

          try:
              target = admission.require_available(catalogue)
          except admission.UnavailableGpu as exc:
              print("STOP:", exc)
              raise SystemExit(1)

          price = target["secure_price"]
          reservation = admission.admit(
              gpu_name=target["id"],
              vram_gb=target["memory_gb"],
              runtime_seconds=admission.RUNTIME_CEILING_SECONDS,
              price_per_hour=price,
          )
          print("LIVE target :", target["id"], f"{target['memory_gb']}GB")
          print("LIVE price  : $", price, "/h (secure cloud) — quoted now, not historical")
          print("Reservation : $", reservation.reserved_usd,
                f"for the full {reservation.runtime_seconds}s ceiling")
          print("Job cap     : $", admission.JOB_CAP_USD, "-> ADMITTED")
          EOF

      - name: "Live prices for every card in the benchmark's hardware matrix"
        # Read-only, $0. The catalogue this reads is the one the financial gate
        # above already pulls; this just prints the owner's candidate cards with
        # their live quotes so the hardware matrix has a real COST column. It
        # lives here rather than in model-bench because model-bench holds no
        # RunPod credential at all, and that fence is worth more than the
        # convenience of one combined table.
        run: python -m validation.gpu_matrix

      - name: Keep the raw payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: discovery.json
          if-no-files-found: ignore

  frames_pull:
    # THE FREE HALF OF THE PROOF, and it needs no generation at all.
    #
    # Objects earlier canaries already wrote are still in the bucket. This
    # job pulls frames out of them over the PUBLIC read base, which
    # exercises the entire chain a paid canary depends on — base
    # validation, URL construction, download, artifact verification,
    # ffmpeg extraction, artifact upload — against real LTX output, for
    # nothing.
    #
    # IT CANNOT SPEND, BY CONSTRUCTION: no RUNPOD_API_KEY is in scope
    # here, no gpu-spend environment, and frame_pull names no endpoint.
    # There is nothing in this job that could submit a job even by
    # mistake.
    name: "frame pull - read-only, $0"
    if: inputs.mode == 'frames-pull'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # MASK FIRST, BEFORE ANYTHING CAN PRINT ONE.
      #
      # A presigned URL is a credential — the signature is in the query and
      # whoever holds the string can read that object until it expires.
      # ::add-mask:: makes GitHub redact it from every later line of this
      # job, which is the same protection story-worker.yml gives the Story
      # job token, and for the same reason: a printed credential is a
      # printed credential even when it is short-lived.
      - name: Mask the signed URLs before any step can echo one
        if: inputs.signed_urls != ''
        env:
          SIGNED_URLS: ${{ inputs.signed_urls }}
        run: |
          python3 - <<'PY'
          import os
          raw = os.environ.get("SIGNED_URLS", "").replace(",", "\n")
          for url in raw.splitlines():
              url = url.strip()
              if url:
                  print(f"::add-mask::{url}")
          PY

      - name: "Frames from objects that already exist (public read)"
        if: inputs.signed_urls == ''
        # Both values travel as ENVIRONMENT, never interpolated into the
        # shell: a dispatch input pasted straight into a `run:` script is
        # a command injection, and the fact that only the owner can
        # dispatch is not a reason to write it that way.
        env:
          R2_PUBLIC_BASE_URL: ${{ inputs.public_base || vars.R2_PUBLIC_BASE_URL }}
          FRAME_KEYS: ${{ inputs.frame_keys }}
        run: python -m validation.frame_pull keys

      - name: "Frames through signed URLs (private bucket)"
        if: inputs.signed_urls != ''
        # No public base is passed at all on this path: the URL carries its
        # own authority and there is nothing for a base to contribute.
        env:
          SIGNED_URLS: ${{ inputs.signed_urls }}
        run: python -m validation.frame_pull signed
      # THE FRAMES, IN THE LOG AS WELL AS THE ARTIFACT. The artifact zip
      # lives on a blob store some review environments cannot reach; the
      # log they can always read. Each PNG under frames/ is base64'd
      # between marker lines, bounded per file and in total, so a remote
      # reviewer can decode and LOOK at the actual frames. Images only —
      # no URL, no credential, nothing but pixels this run produced.
      - name: "Frames inline in the log, for remote inspection"
        if: always()
        run: |
          python3 - <<'PYEOF'
          import base64, os
          root = "frames"
          if not os.path.isdir(root):
              print("no frames directory - nothing to inline")
              raise SystemExit(0)
          total = 0
          # Contact sheets first: one sheet shows a whole clip, so a budget
          # cut loses the least informative files, not the most.
          ordered = sorted(
              os.listdir(root),
              key=lambda n: (0 if n.endswith("-sheet.png") else 1, n),
          )
          for name in ordered:
              if not name.endswith(".png"):
                  continue
              path = os.path.join(root, name)
              size = os.path.getsize(path)
              if size > 2_000_000:
                  print(f"=== FRAME SKIPPED {name} ({size} bytes over the 2MB cap) ===")
                  continue
              if total + size > 8_000_000:
                  print("=== FRAME BUDGET EXHAUSTED - download the ltx-frames artifact for the rest ===")
                  break
              total += size
              data = base64.b64encode(open(path, "rb").read()).decode()
              print(f"=== FRAME b64 {name} {size} ===")
              for i in range(0, len(data), 3800):
                  print(data[i : i + 3800])
              print(f"=== END {name} ===")
          PYEOF

      - name: "The frames, for inspection"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx-frames
          path: frames/
          if-no-files-found: warn
          retention-days: 30

  template_probe:
    name: "template probe - read-only, $0"
    if: inputs.mode == 'template-probe'
    runs-on: ubuntu-latest
    environment: gpu-spend
    permissions:
      contents: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "What templates exist, and is there an API to make one?"
        run: python -m validation.template_probe "${{ inputs.template_id }}"

  image_size:
    name: "image size projection - read-only, $0"
    if: inputs.mode == 'image-size'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "The runner's real disk, not the planning number"
        run: |
          df -B1 --output=source,size,avail,target / /mnt || true

      - name: "Build the base stage - the one addend no registry can answer"
        run: docker build --target base -t oniq-gpu-worker:size .

      - name: "Project the media image from the Dockerfile's own parameters"
        run: |
          BASE=$(docker image inspect oniq-gpu-worker:size --format '{{.Size}}')
          echo "base stage measured at ${BASE} bytes"
          python -m validation.image_size "${BASE}"

  template_attach:
    # Creates ONE template naming an already-published image, and points
    # ONE endpoint at it. The second half of owner directive 2026-08-28.
    # Refuses a tag (only a digest is an identity), an endpoint RunPod
    # does not confirm, and an endpoint whose current template still
    # RESOLVES — the warrant for writing is that the reference is
    # dangling. Sends templateId and nothing else, so the endpoint's GPU
    # and worker bounds cannot move. Costs nothing: workersMin stays 0,
    # so no pod starts until a job arrives.
    name: "template attach - ONE template, ONE endpoint, $0"
    if: inputs.mode == 'template-attach' && inputs.attach_token == 'ATTACH-TEMPLATE'
    runs-on: ubuntu-latest
    environment: gpu-spend
    permissions:
      contents: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Create the template, attach it, re-read the endpoint"
        run: python -m validation.template_attach "${{ inputs.endpoint_id }}" "${{ inputs.image_ref }}" "${{ inputs.attach_token }}"

  template_env:
    # Puts the three storage variables on the template BY REFERENCE, so
    # the worker can write its output. Owner directive 2026-08-28: the
    # values stay in RunPod's secret store; what is written here is
    # `{{ RUNPOD_SECRET_<name> }}`, which carries no credential. No R2
    # value enters this repository, a GitHub secret, or a log line.
    #
    # Sends the env field and nothing else, so the image the proofs ran
    # against cannot move underneath the endpoint. Refuses foreign env
    # rather than clobbering it, and verifies over BOTH the REST and
    # GraphQL views. Costs nothing: no pod starts.
    name: "template env - ONE template, by reference, $0"
    if: inputs.mode == 'template-env' && inputs.env_token == 'SET-TEMPLATE-ENV'
    runs-on: ubuntu-latest
    environment: gpu-spend
    permissions:
      contents: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Set the storage variables by reference, then re-read both views"
        run: python -m validation.template_env "${{ inputs.template_id }}" "${{ inputs.secret_names }}" "${{ inputs.env_token }}"

  ltx_discover:
    # Which LTX checkpoints actually EXIST, measured with the credential.
    # Run 7 proved the Dockerfile names one that does not: unauthenticated
    # the registry answers 401 for gated and for absent alike, and with a
    # working token the same path answers 404. Read-only, $0, and it
    # deliberately CHOOSES nothing - which checkpoint ships is the owner's
    # decision, and a name picked here to make a build succeed would be the
    # substitution the directive forbids.
    name: "LTX catalogue - read-only, $0"
    if: inputs.mode == 'ltx-discover'
    runs-on: ubuntu-latest
    environment: gpu-spend
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "List what the publisher actually offers, and measure each"
        run: python -m validation.hf_discover

  model_bench:
    # The expanded benchmark's free half (owner brief 2026-08-29). It reads
    # the registry and does arithmetic; it submits nothing, so it carries NO
    # RunPod credential and cannot become a paid mode by mistake — the same
    # fence frames-pull sits behind. HF_TOKEN is here because an anonymous
    # 401 cannot tell a gated repository from an absent one, which is the
    # confusion run 7 already paid for once.
    name: "model bench - read-only, $0"
    if: inputs.mode == 'model-bench'
    runs-on: ubuntu-latest
    environment: gpu-spend
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BENCH_JSON: bench.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Measure all nine candidates, project the VRAM matrix"
        run: python -m validation.model_bench
      - name: "Keep the measured matrix"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-bench
          path: bench.json
          if-no-files-found: warn

  queue_probe:
    name: "queue probe - read-only, $0"
    if: inputs.mode == 'queue-probe'
    runs-on: ubuntu-latest
    environment: gpu-spend
    permissions:
      contents: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Can this run still execute?"
        run: python -m validation.queue_probe "${{ inputs.stale_job_id }}"

  stale_cancel:
    # Cancels ONE run on ONE endpoint, both named on the dispatch, and
    # only when the literal token is typed. NOT a queue purge: draining
    # every queued job is broader than the authorization given, and
    # validation/stale_run.py carries a gate asserting the queue-wide
    # verb appears nowhere in it. Cancelling costs nothing; endpoint,
    # template and worker bounds are untouched.
    name: "stale run cancel - ONE job, $0"
    if: inputs.mode == 'stale-cancel' && inputs.cancel_token == 'CANCEL-STALE-RUN'
    runs-on: ubuntu-latest
    environment: gpu-spend
    permissions:
      contents: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Verify the owner endpoint, cancel the one run, re-verify"
        run: python -m validation.stale_run "${{ inputs.stale_job_id }}" "${{ inputs.endpoint_id }}" "${{ inputs.cancel_token }}"

  advisory:
    # The STANDALONE free preflight (phases 9-10, $0): pods, endpoint
    # identity/config/exclusivity, R2 env NAMES, live quote + admission.
    # It does NOT gate the spend path (owner directive 2026-08-25 — no
    # `needs` anywhere points here) and it cannot spend: the driver's
    # `preflight` argv never provisions. On this repository's plan the
    # final advisory step — reading a required-reviewer rule back — is
    # EXPECTED to refuse with environment-unprotected (the same gap
    # APPROVAL_MODE owner-dispatch records), so a red run here with the
    # endpoint facts printed above the stop is the designed outcome; it
    # exists to READ the live endpoint, not to go green.
    name: "Advisory free preflight — live endpoint read, $0"
    if: inputs.mode == 'advisory'
    runs-on: ubuntu-latest
    environment: gpu-spend
    # MEASURED 2026-08-28: the environments API wants actions:read, not
    # deployments:read. deployments:read alone answered 403 on runs
    # 26-40 while the hint kept blaming it; adding actions:read on run
    # 41 returned 200 and the gate read the environment back for the
    # first time. It reported environment-unprotected — gpu-spend exists
    # and carries NO required reviewer — which independently confirms
    # owner directive 2026-08-25 through the API rather than through the
    # console UI failing to render the section. Unverifiable became
    # verified; the gate is unchanged and still stops. Read-only.
    permissions:
      contents: read
      deployments: read
      actions: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      ENDPOINT_ID: ${{ inputs.endpoint_id }}
      GPU_TEST_INPUT_REF: ${{ inputs.test_input_key || vars.GPU_TEST_INPUT_REF }}
      GPU_TEST_OUTPUT_PREFIX: ${{ inputs.test_output_prefix || vars.GPU_TEST_OUTPUT_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Credential present (owner action if not)
        run: |
          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "::error::RUNPOD_API_KEY secret is not configured on this repository. Adding it is an owner action. Nothing was spent."
            exit 1
          fi
          echo "credential present"
      - name: "Phases 9-10: every free verification, $0"
        run: python -m validation.spend_run preflight

  spend:
    name: "Phase 9-19: every check in-job, then gated live validation"
    if: inputs.mode == 'spend' && inputs.spend == 'SPEND'
    runs-on: ubuntu-latest
    environment: gpu-spend
    # The run path performs every check itself, immediately before
    # provisioning (owner directive 2026-08-25: no separate preflight
    # job may block the authorized run). actions/deployments read: the
    # job reads back this run's own recorded approval — evidence the
    # gpu-spend pause really happened — and refuses to provision
    # without it; contents-read-only answers 403 there (measured).
    permissions:
      contents: read
      deployments: read
      actions: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      ENDPOINT_ID: ${{ inputs.endpoint_id }}
      GPU_TEST_INPUT_REF: ${{ inputs.test_input_key || vars.GPU_TEST_INPUT_REF }}
      GPU_TEST_OUTPUT_PREFIX: ${{ inputs.test_output_prefix || vars.GPU_TEST_OUTPUT_PREFIX }}
      THROUGH_PHASE: ${{ inputs.through_phase }}
      OP: ${{ inputs.op }}
      PLATE: ${{ inputs.plate }}
      # The battery PROVES both conditioning plates exist over the public
      # read base before its first paid submission (require_plates) — the
      # run 72 lesson, times five.
      R2_PUBLIC_BASE_URL: ${{ inputs.public_base || vars.R2_PUBLIC_BASE_URL }}
      # Owner directive 2026-08-25: required reviewers are not offered on
      # this private repository's GitHub plan (the protection-rules
      # section does not render), so the owner's authenticated SPEND
      # dispatch is the approval for the authorized single job. Delete
      # this line to restore the recorded-approval evidence requirement.
      APPROVAL_MODE: owner-dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Phases 12-19 (re-preflighted, re-quoted, fail-closed)"
        run: python -m validation.spend_run run

      # ----------------------------------------------------------------
      # FRAMES, NOT METADATA (owner directive 2026-08-29).
      #
      #   LTX generation -> R2 -> frame extraction -> CI artifact -> eye
      #
      # Every LTX judgement before this was made from a COMPLETED status,
      # a frame count and a byte count. None of those can tell you
      # whether the character turned their head or whether the model
      # smeared the plate for four seconds, and a route to the frames
      # that needs a human to remember it is a route nobody takes.
      #
      # EVERY STEP HERE IS AFTER THE SPEND, AND if: always(). The GPU
      # work is finished and paid for by the time any of this runs, so a
      # missing ffmpeg, an unset variable or a 404 on the bucket can
      # never fail a generation that already succeeded and was already
      # verified. The artifacts stay in R2 either way; what is lost is
      # only the seeing, and the log says so plainly.
      #
      # NOTHING HERE HOLDS A CREDENTIAL. R2_PUBLIC_BASE_URL is a
      # repository VARIABLE, not a secret, because it is the same public
      # read base the application already fetches artifacts from with no
      # Authorization header — gate 6 still stands, and R2's write
      # credentials remain in the RunPod endpoint's environment alone.
      # frame_pull REFUSES a base carrying a query, fragment or userinfo,
      # so a presigned URL pasted in by mistake is rejected as the
      # credential it is rather than used as a base.
      - name: ffmpeg (after the spend, so apt can never block a paid run)
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: "Frames from the clips this run actually produced"
        if: always()
        env:
          # The dispatch input wins over the variable, the same way
          # endpoint_id and test_input_key already do — so a run is never
          # blocked on a repository variable being wrong, and a value can
          # be corrected without an owner visiting the settings page.
          R2_PUBLIC_BASE_URL: ${{ inputs.public_base || vars.R2_PUBLIC_BASE_URL }}
        run: python -m validation.frame_pull

      # THE FRAMES, IN THE LOG AS WELL AS THE ARTIFACT. The artifact zip
      # lives on a blob store some review environments cannot reach; the
      # log they can always read. Each PNG under frames/ is base64'd
      # between marker lines, bounded per file and in total, so a remote
      # reviewer can decode and LOOK at the actual frames. Images only —
      # no URL, no credential, nothing but pixels this run produced.
      - name: "Frames inline in the log, for remote inspection"
        if: always()
        run: |
          python3 - <<'PYEOF'
          import base64, os
          root = "frames"
          if not os.path.isdir(root):
              print("no frames directory - nothing to inline")
              raise SystemExit(0)
          total = 0
          # Contact sheets first: one sheet shows a whole clip, so a budget
          # cut loses the least informative files, not the most.
          ordered = sorted(
              os.listdir(root),
              key=lambda n: (0 if n.endswith("-sheet.png") else 1, n),
          )
          for name in ordered:
              if not name.endswith(".png"):
                  continue
              path = os.path.join(root, name)
              size = os.path.getsize(path)
              if size > 2_000_000:
                  print(f"=== FRAME SKIPPED {name} ({size} bytes over the 2MB cap) ===")
                  continue
              if total + size > 8_000_000:
                  print("=== FRAME BUDGET EXHAUSTED - download the ltx-frames artifact for the rest ===")
                  break
              total += size
              data = base64.b64encode(open(path, "rb").read()).decode()
              print(f"=== FRAME b64 {name} {size} ===")
              for i in range(0, len(data), 3800):
                  print(data[i : i + 3800])
              print(f"=== END {name} ===")
          PYEOF

      - name: "The frames, for inspection"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx-frames
          path: |
            frames/
            artifact-manifest.json
          if-no-files-found: warn
          retention-days: 30

  standby_probe:
    # READ-ONLY twin of the standby job. Owner directive 2026-08-27: run
    # the standby diagnostic, and stop re-attempting a mutation already
    # proven unsupported. Both were impossible together while the probes
    # lived inside the patch-failure branch — reading the answer required
    # attempting the write. This job calls the same two introspections
    # through a path that cannot write, so the evidence is repeatable at
    # $0 without touching the endpoint.
    name: "standby diagnostic — read-only, $0"
    if: inputs.mode == 'standby-probe'
    runs-on: ubuntu-latest
    environment: gpu-spend # the key is an environment secret; see discover
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read standby facts and the API schema (no write)
        run: python -m validation.standby_zero probe

  standby:
    # The harness's ONLY endpoint mutation, owner-directed 2026-08-26:
    # workersStandby -> the literal 0 (NO JOB = NO GPU WORKER). The
    # patched value is hard-coded in runpod_client.set_workers_standby_zero
    # — no input carries a worker count, so this job can only scale DOWN.
    # It submits nothing; verification is a fresh read, $0.
    name: "workersStandby -> 0 (spend reduction, $0)"
    if: inputs.mode == 'standby-zero'
    runs-on: ubuntu-latest
    environment: gpu-spend # the key is an environment secret; see discover
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify -> patch literal zero -> fresh-read verify
        run: python -m validation.standby_zero

  sweep:
    name: "orphan sweep — None is never 0"
    needs: [discover, spend, standby, standby_probe]
    if: always()
    runs-on: ubuntu-latest
    environment: gpu-spend # the key is an environment secret; see discover
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sweep
        run: |
          python - <<'EOF'
          import runpod_client as rp
          result = None
          try:
              result = rp.sweep_orphans()
          except Exception as exc:
              print("sweep raised:", type(exc).__name__)
          if result is None:
              print("STOP: cannot confirm zero orphans (sweep reports None, never 0)")
              raise SystemExit(1)
          print("pods:", result["pods"], "endpoint min workers:", result["endpoint_min_workers"])
          if result["pods"] != 0 or result["endpoint_min_workers"] != 0:
              print("ORPHAN ALARM: something can still bill")
              raise SystemExit(1)
          print("orphan count = 0, confirmed")
          EOF
