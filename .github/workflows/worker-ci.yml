# Worker CI — builds and proves the artifact WITHOUT CUDA hardware and
# WITHOUT any provider credential. This workflow holds no secrets: it can
# run on every push precisely because nothing it does can spend money.
# The workflow that can spend is gpu-validation.yml, and that one is
# workflow_dispatch-only.

name: worker-ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-licence:
    # The media build's licence gate, asked of the live registry from
    # METADATA ONLY — no weights, no GPU, seconds not minutes. The gate
    # itself stays in the Dockerfile, which is the only place that can
    # actually stop a bake; this job parses its parameters back out and
    # checks the world against them, so a withdrawn repo or a changed
    # licence is found before an owner spends a long media build on it.
    # Restating CANDIDATES here instead of deriving them is the defect
    # that put storygen.py in three lists and none of the images.
    name: Qwen licence gate — metadata only, no weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The gate, against the live registry
        run: python -m validation.qwen_assets

  tests:
    name: tests (uid 10001, read-only /app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret and shell-surface scan
        run: |
          set -eu
          FILES="contract.py preprocess.py storage.py handler.py videogen.py audio.py runpod_client.py validation/admission.py validation/spend_run.py validation/standby_zero.py validation/qwen_assets.py"
          for pattern in 'eval(' 'exec(' 'subprocess' 'os.system' 'pickle' 'shell=True'; do
            if grep -Fn "$pattern" $FILES; then
              echo "FORBIDDEN CALL FOUND: $pattern"; exit 1
            fi
          done
          if grep -RInE '(AKIA[0-9A-Z]{16}|-----BEGIN|api_key\s*=\s*["'"'"'][A-Za-z0-9]{16,})' $FILES; then
            echo "CREDENTIAL-SHAPED STRING FOUND"; exit 1
          fi
          echo "scan clean"

      - name: Dockerfile shape gates
        run: |
          set -eu
          # Instructions only: the comments talk ABOUT the forbidden
          # shapes, so the raw file would trip its own scan.
          grep -v '^[[:space:]]*#' Dockerfile > /tmp/df-instructions
          if grep -En '^\s*ARG\b' /tmp/df-instructions; then echo "ARG found"; exit 1; fi
          grep -Eq '^CMD \["python3", "-u", "handler.py"\]$' /tmp/df-instructions
          grep -Eq '^USER oniq:oniq$' /tmp/df-instructions
          if grep -En '^COPY \.([/ ]|$)' /tmp/df-instructions; then echo "COPY . found"; exit 1; fi
          echo "Dockerfile gates hold"

      - name: Build the uid-10001 read-only rig
        run: |
          set -eu
          sudo groupadd --gid 10001 oniq
          sudo useradd --uid 10001 --gid 10001 --create-home --home-dir /home/oniq oniq
          sudo mkdir -p /opt/app
          sudo cp -r . /opt/app/
          sudo chown -R root:root /opt/app
          sudo chmod -R a+rX,go-w /opt/app
          python -m venv /opt/venv
          /opt/venv/bin/pip install --quiet -r requirements.txt -r requirements-dev.txt
          sudo chown -R root:root /opt/venv

      - name: Fetch the sha256-pinned piper voice (real-synth tests)
        run: |
          set -eu
          curl -sSL --fail --retry 3 -o /tmp/voice.tar.gz \
            https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz
          echo "de346b054703a190782f49acb9b93c50678a884fede49cfd85429d204802d678  /tmp/voice.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/voice
          sudo tar xzf /tmp/voice.tar.gz -C /opt/voice
          sudo chown -R root:root /opt/voice && sudo chmod -R a+rX /opt/voice

      - name: Worker + harness tests as uid 10001
        run: |
          set -eu
          # Launch from /opt/app: pytest chdirs back to its start
          # directory on exit, and the runner-owned checkout is not
          # enterable by uid 10001 — run #2 proved the tests pass and
          # then crashed on exactly that final chdir.
          sudo -u oniq env HOME=/home/oniq PYTHONDONTWRITEBYTECODE=1 \
            ONIQ_TEST_VOICE_DIR=/opt/voice \
            sh -c 'cd /opt/app && /opt/venv/bin/python -m pytest tests -q -p no:cacheprovider'
          if sudo -u oniq sh -c 'touch /opt/app/probe 2>/dev/null'; then
            echo "runtime user can WRITE to /app — rig invalid"; exit 1
          fi
          if find /opt/app -name '__pycache__' | grep -q .; then
            echo "__pycache__ written into /app"; exit 1
          fi
          echo "39-suite rig holds: tests pass, /app read-only, no bytecode"

  image:
    name: docker build + in-image proofs (no CUDA gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --target base -t oniq-gpu-worker:ci .

      - name: torch is the cu121 build
        run: |
          docker run --rm oniq-gpu-worker:ci python3 -c "import torch; assert torch.version.cuda == '12.1', torch.version.cuda; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: CUDA availability is reported, never gated here
        run: |
          # On a CPU runner is_available() is FALSE whatever the image
          # contains; the answer carries no information about the image
          # and must not be read as a failed gate. The meaningful check
          # runs on the rented card, in gpu-validation.yml.
          docker run --rm oniq-gpu-worker:ci python3 -c "import torch; print('cuda available on this runner:', torch.cuda.is_available())"

      - name: Imports and serverless entrypoint
        run: |
          docker run --rm oniq-gpu-worker:ci python3 -c "import contract, preprocess, storage, handler, videogen, audio, storygen; import runpod; assert hasattr(runpod.serverless, 'start'); import numpy, torch; t = torch.zeros(2, 3, dtype=torch.uint8); assert t.numpy().tobytes() == bytes(6); import diffusers, transformers, imageio, imageio_ffmpeg; from diffusers import LTXImageToVideoPipeline; import av; from piper import PiperVoice; import modelprobe; print('imports ok, tensor->bytes ok, LTX pipeline importable, piper+av importable, modelprobe importable')"

      # THE COEXISTENCE PROOF (owner directive 2026-08-27). Qwen3 needs
      # EVERY PIPELINE THE BENCHMARK NEEDS, importable on the shipped pins.
      # Not a formality: diffusers 0.33.1 carried WanImageToVideoPipeline but
      # no `transformer_2`, so Wan2.2 would have imported cleanly and then
      # failed on a rented GPU with the checkpoint already downloaded. The
      # class existing is not the same as the class being able to load the
      # model, so the two-expert attribute is asserted too.
      - name: every benchmark pipeline is importable and Wan2.2-capable
        run: |
          docker run --rm oniq-gpu-worker:ci python3 - <<'PY'
          import inspect

          import diffusers
          from diffusers import (
              CogVideoXImageToVideoPipeline,
              HunyuanVideo15ImageToVideoPipeline,
              LTXImageToVideoPipeline,
              WanImageToVideoPipeline,
          )

          print("diffusers", diffusers.__version__)
          params = inspect.signature(WanImageToVideoPipeline.__init__).parameters
          assert "transformer_2" in params, (
              "this diffusers cannot drive Wan2.2's two-expert mixture: "
              f"WanImageToVideoPipeline takes {sorted(params)}"
          )
          # The 13B LTX checkpoint is a single root-level file, which needs
          # the single-file loader rather than a component directory.
          assert hasattr(LTXImageToVideoPipeline, "from_single_file")
          # HunyuanVideo-1.5 (2026-08-29): the pipeline exists at 0.36.0 but
          # the class existing is again not the class being able to run the
          # STEP-DISTILLED checkpoint — that needs the meanflow branch, and
          # the transformers side needs Qwen2_5_VLTextModel (absent below
          # 4.52.0, which is exactly why 4.51.3 was bumped). Both asserted
          # here so a pin regression fails a free build, not a rented GPU.
          call_params = inspect.signature(
              HunyuanVideo15ImageToVideoPipeline.__call__).parameters
          assert "width" not in call_params and "height" not in call_params, (
              "hunyuan i2v grew canvas kwargs; modelprobe's no-canvas row "
              f"assumption no longer holds: {sorted(call_params)}"
          )
          from transformers import Qwen2_5_VLTextModel  # noqa: F401
          import regex, ftfy, huggingface_hub  # noqa: F401
          print("wan/ltx/cogvideox/hunyuan15 importable; "
                "Wan2.2 two-expert supported; Qwen2_5_VLTextModel present")
          PY

      # transformers >= 4.51 and LTX runs on diffusers 0.33.1 / torch
      # 2.5.1; the bump had to be PROVEN against those pins rather than
      # assumed. This step fails the build if the story model's config
      # class and the LTX pipeline cannot be constructed from the same
      # installed set — which is exactly the breakage a blind upgrade
      # would have shipped to a paid worker.
      - name: story model and LTX coexist on one dependency set
        run: |
          docker run --rm oniq-gpu-worker:ci python3 -c "
          import transformers, diffusers, torch
          from packaging.version import Version
          assert Version(transformers.__version__) >= Version('4.51.0'), transformers.__version__
          # Qwen3 must be a KNOWN architecture to this transformers, or a
          # baked checkpoint would raise KeyError: 'qwen3' at job time.
          from transformers.models.auto.configuration_auto import CONFIG_MAPPING_NAMES
          assert 'qwen3' in CONFIG_MAPPING_NAMES, sorted(CONFIG_MAPPING_NAMES)[:5]
          from transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig
          from diffusers import LTXImageToVideoPipeline, LTXPipeline
          import storygen
          assert storygen.weights_present('/app/models/story') is False
          print('coexist ok:', 'transformers', transformers.__version__,
                'diffusers', diffusers.__version__, 'torch', torch.__version__)
          "

      - name: Runtime user is uid 10001 and /app is not writable
        run: |
          test "$(docker run --rm oniq-gpu-worker:ci id -u)" = "10001"
          docker run --rm oniq-gpu-worker:ci python3 -c "
          import os
          assert not os.access('/app', os.W_OK), '/app writable by runtime user'
          print('uid 10001, /app read-only')
          "

      - name: Image carries exactly the shipped files and nothing else
        run: |
          set -eu
          # DERIVED, not enumerated. This list used to be typed out here,
          # which made it the THIRD hand-maintained copy of the shipped
          # set — and on 2026-08-27 storygen.py was missing from the other
          # two, so a stale third copy would only have hidden the fix.
          # The Dockerfile's own COPY destinations are the source of
          # truth; tests/test_workflow_gates.py ties THAT set to the
          # modules handler.py actually imports. This step keeps the other
          # half of the property the enumeration was really for: nothing
          # EXTRA is in the image either.
          expect=$(grep -E '^COPY ' Dockerfile | awk '{print $NF}' | xargs -n1 basename | sort | paste -sd, -)
          echo "expecting: $expect"
          docker run --rm -e EXPECT="$expect" oniq-gpu-worker:ci python3 -c "
          import os
          found = sorted(os.listdir('/app'))
          expect = sorted(os.environ['EXPECT'].split(','))
          assert found == expect, ('in image: %r, dockerfile COPYs: %r' % (found, expect))
          print('payload exact:', found)
          "
