name: image-publish

# Build the `media` image and push it to a registry, so a RunPod template
# has something to name.
#
# OWNER DIRECTIVE 2026-08-28 (route 2). RunPod's API cannot build an image
# from a repository — POST /templates requires an imageName and accepts no
# repo, git or build field, measured from the live OpenAPI document on
# 2026-08-28 — so a template can only ever REFERENCE an image that already
# exists. The endpoint p3zmlv8ek10dzt has referenced a template that does
# not exist since the worker was deleted, because RunPod's own builder
# held the only copy of the image. This workflow ends that: the image
# lives in a registry ONIQ controls, and can be rebuilt from source.
#
# NEVER on push. The media stage bakes an LTX pipeline, an 8B causal LLM
# and a torch+CUDA stack; building it per commit would burn hours of
# runner time for nothing. Dispatch only, behind a literal token, the same
# shape as the stale-run cancel.
#
# This workflow deliberately carries NO RunPod credential and touches no
# endpoint. Pushing an image cannot start a worker or spend GPU money;
# keeping the two apart means a mistake here cannot become a GPU bill.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Type PUBLISH-MEDIA-IMAGE (exactly) to allow the build and push."
        type: string
        default: ""
      tag:
        description: "Extra tag to apply alongside the commit SHA (optional)."
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: "build --target media and push to GHCR"
    if: inputs.publish == 'PUBLISH-MEDIA-IMAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: "Disk before anything — the figure the projection is checked against"
        run: df -B1 --output=source,size,used,avail,target / /mnt || true

      - name: "Reclaim the runner's preinstalled toolchains"
        run: |
          # The hosted runner ships several toolchains this build never
          # uses, and they occupy most of the root filesystem. Removing
          # them is the difference between a build that fits and one that
          # dies at 90% with no space left.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache/CodeQL}" || true
          df -B1 --output=source,size,used,avail,target / /mnt || true

      - name: "Move the docker data root onto /mnt"
        run: |
          # /mnt is the large ephemeral disk; / is not big enough to hold
          # this image's layers and its assembled copy at the same time.
          # Done before any build so no layer is ever written to /.
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          printf '{ "data-root": "/mnt/docker" }\n' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'docker data root: {{.DockerRootDir}}'

      - name: "Log in to GHCR"
        env:
          # Through the environment, never interpolated into the script
          # text: an expression expanded into a run block becomes part of
          # the command line, which is the documented injection shape and
          # is the wrong place for a credential regardless.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The workflow's own short-lived token. No long-lived credential
          # is stored for the push side; the PULL side is a separate
          # credential that lives only in RunPod.
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

      - name: "Build the media stage"
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          docker build --target media \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" .
          docker image inspect "${IMAGE}:${GITHUB_SHA}" --format \
            'built size: {{.Size}} bytes'

      - name: "The image proves itself before it is published"
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          # A pushed image that cannot start is worse than no image: it
          # turns a visible dangling reference into a worker that fails on
          # the rented card, at cost. These are the same in-image proofs
          # worker-ci runs on the base stage, plus the two facts only the
          # media stage can answer.
          docker run --rm "${IMAGE}:${GITHUB_SHA}" python3 -c "import handler; print('handler imports')"
          docker run --rm "${IMAGE}:${GITHUB_SHA}" python3 -c "import torch; assert torch.version.cuda == '12.1', torch.version.cuda; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
          docker run --rm "${IMAGE}:${GITHUB_SHA}" sh -c 'cat /app/models/MODEL_ID /app/models/STORY_MODEL_ID'
          docker run --rm "${IMAGE}:${GITHUB_SHA}" python3 -c "
import os
for p in ('/app/models/ltx/model_index.json', '/app/models/story/config.json',
          '/app/models/piper/en-us-ryan-high.onnx'):
    assert os.path.exists(p), p
print('every baked asset is present')
"
          docker run --rm "${IMAGE}:${GITHUB_SHA}" id | grep -q 'uid=10001' \
            && echo 'runs as uid 10001, not root'

      - name: "Push, and record the immutable digest"
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          EXTRA: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          if [ -n "${EXTRA}" ]; then
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:${EXTRA}"
            docker push "${IMAGE}:${EXTRA}"
          fi
          # A TAG IS NOT AN IDENTITY. Tags move; a digest does not, and
          # the template is to name the digest so the endpoint can never
          # silently start running a different image than the one these
          # proofs passed on.
          DIGEST=$(docker image inspect "${IMAGE}:${GITHUB_SHA}" \
            --format '{{index .RepoDigests 0}}')
          echo "PUBLISHED: ${DIGEST}"
          {
            echo "### media image published"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- digest: \`${DIGEST}\`"
            echo ""
            echo "Name the DIGEST in the template, never the tag."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: "Disk after — so the next projection has a real figure"
        if: always()
        run: df -B1 --output=source,size,used,avail,target / /mnt || true
